<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>To-Do</h1>

    <form class="add" action="{{ url_for('add') }}" method="post">
      <input name="task" placeholder="What needs doing?" autocomplete="off" autofocus required>
      <button type="submit">Add</button>
    </form>

    {% if tasks %}
      <ul>
        {% for task in tasks %}
          <li class="{{ 'done' if task.done }}">
            <form class="toggle" action="{{ url_for('toggle', index=loop.index0) }}" method="post">
              <label>
                <input type="checkbox" onchange="this.form.submit()" {{ 'checked' if task.done }}>
                <span>{{ task.text }}</span>
              </label>
            </form>
            <form action="{{ url_for('remove', index=loop.index0) }}" method="post">
              <button class="remove" type="submit" aria-label="Remove {{ task.text }}">&times;</button>
            </form>
          </li>
        {% endfor %}
      </ul>
      {% set done_count = tasks|selectattr('done')|list|length %}
      <p class="count">{{ done_count }} of {{ tasks|length }} done</p>
    {% else %}
      <p class="empty">No tasks yet. Add one above.</p>
    {% endif %}
  </main>
</body>
</html>
