<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main>
    <h1>To-Do</h1>

    <form class="add" action="{{ url_for('add') }}" method="post">
      <input name="task" placeholder="What needs doing?" autocomplete="off" autofocus required>
      <button type="submit">Add</button>
    </form>

    {% if tasks %}
      <ul>
        {% for task in tasks %}
          <li>
            <span>{{ task }}</span>
            <form action="{{ url_for('remove', index=loop.index0) }}" method="post">
              <button class="remove" type="submit" aria-label="Remove {{ task }}">&times;</button>
            </form>
          </li>
        {% endfor %}
      </ul>
      <p class="count">{{ tasks|length }} task{{ '' if tasks|length == 1 else 's' }}</p>
    {% else %}
      <p class="empty">No tasks yet. Add one above.</p>
    {% endif %}
  </main>
</body>
</html>
